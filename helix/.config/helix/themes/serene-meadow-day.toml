# Serene Meadow Day - Eye-friendly light theme with enhanced syntax distinction
# Uses subtle background colors to clearly distinguish syntax elements
# Based on optometry research for computer vision syndrome

# Syntax Highlighting
"attribute" = { fg = "slate_blue", bg = "slate_bg" }
"type" = { fg = "ochre", bg = "ochre_bg" }
"type.builtin" = { fg = "ochre", bg = "ochre_bg" }
"type.parameter" = { fg = "ochre", bg = "ochre_bg" }
"type.enum.variant" = { fg = "spruce", bg = "spruce_bg" }
"constructor" = { fg = "slate_blue", bg = "slate_bg" }
"constant" = { fg = "cinnamon", bg = "cinnamon_bg" }
"constant.builtin" = { fg = "cinnamon", bg = "cinnamon_bg" }
"constant.builtin.boolean" = { fg = "cinnamon", bg = "cinnamon_bg" }
"constant.character" = { fg = "leaf", bg = "string_bg" }
"constant.character.escape" = "charcoal"
"constant.numeric" = { fg = "cinnamon", bg = "cinnamon_bg" }
"string" = { fg = "leaf", bg = "string_bg" }
"string.regexp" = "charcoal"
"string.special" = "charcoal"
"comment" = { fg = "comment", modifiers = ["italic"] }
"comment.line" = { fg = "comment", modifiers = ["italic"] }
"comment.block" = { fg = "comment", modifiers = ["italic"] }
"variable" = "taupe"
"variable.builtin" = { fg = "plum", bg = "keyword_bg" }
"variable.parameter" = "taupe"
"variable.other.member" = "taupe"
"label" = { fg = "plum", bg = "keyword_bg" }
"punctuation" = "taupe"
"punctuation.delimiter" = "taupe"
"punctuation.bracket" = "taupe"
"punctuation.special" = "charcoal"
"keyword" = { fg = "plum", bg = "keyword_bg" }
"keyword.control" = { fg = "plum", bg = "keyword_bg" }
"keyword.control.conditional" = { fg = "plum", bg = "keyword_bg" }
"keyword.control.repeat" = { fg = "plum", bg = "keyword_bg" }
"keyword.control.import" = "charcoal"
"keyword.control.return" = { fg = "spruce", bg = "spruce_bg" }
"keyword.control.exception" = { fg = "spruce", bg = "spruce_bg" }
"keyword.operator" = "charcoal"
"keyword.directive" = { fg = "plum", bg = "keyword_bg" }
"keyword.function" = { fg = "plum", bg = "keyword_bg" }
"keyword.storage" = { fg = "plum", bg = "keyword_bg" }
"keyword.storage.type" = { fg = "ochre", bg = "ochre_bg" }
"keyword.storage.modifier" = { fg = "plum", bg = "keyword_bg" }
"operator" = "charcoal"
"function" = { fg = "slate_blue", bg = "slate_bg" }
"function.builtin" = { fg = "slate_blue", bg = "slate_bg" }
"function.method" = { fg = "slate_blue", bg = "slate_bg" }
"function.macro" = { fg = "plum", bg = "keyword_bg" }
"function.special" = "charcoal"
"tag" = { fg = "plum", bg = "keyword_bg" }
"namespace" = { fg = "spruce", bg = "spruce_bg" }
"special" = "charcoal"

# Markup
"markup.heading" = { fg = "slate_blue", bg = "slate_bg" }
"markup.heading.marker" = "comment"
"markup.heading.1" = { fg = "slate_blue", bg = "slate_bg", modifiers = ["bold"] }
"markup.heading.2" = { fg = "slate_blue", bg = "slate_bg", modifiers = ["bold"] }
"markup.heading.3" = { fg = "slate_blue", bg = "slate_bg", modifiers = ["bold"] }
"markup.heading.4" = { fg = "slate_blue", bg = "slate_bg", modifiers = ["bold"] }
"markup.heading.5" = { fg = "slate_blue", bg = "slate_bg", modifiers = ["bold"] }
"markup.heading.6" = { fg = "slate_blue", bg = "slate_bg", modifiers = ["bold"] }
"markup.list" = { fg = "charcoal", bg = "keyword_bg" }
"markup.list.unnumbered" = { fg = "charcoal", bg = "keyword_bg" }
"markup.list.numbered" = { fg = "charcoal", bg = "keyword_bg" }
"markup.bold" = { fg = "ochre", modifiers = ["bold"] }
"markup.italic" = { fg = "ochre", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "plum", bg = "keyword_bg", modifiers = ["underlined"] }
"markup.link.label" = { fg = "charcoal", bg = "keyword_bg" }
"markup.link.text" = { fg = "plum", bg = "keyword_bg" }
"markup.quote" = { fg = "comment", modifiers = ["italic"] }
"markup.raw" = { fg = "leaf", bg = "string_bg" }
"markup.raw.inline" = { fg = "leaf", bg = "string_bg" }
"markup.raw.block" = { fg = "leaf", bg = "string_bg" }

# Diff
"diff.plus" = "leaf"
"diff.plus.gutter" = "leaf"
"diff.minus" = { fg = "rosewood", bg = "rose_bg" }
"diff.minus.gutter" = "error"
"diff.delta" = "slate_blue"
"diff.delta.moved" = "plum"

# UI
"ui.background" = { bg = "background" }
"ui.background.separator" = "border"
"ui.cursor" = { fg = "background", bg = "foreground" }
"ui.cursor.normal" = { fg = "background", bg = "foreground" }
"ui.cursor.insert" = { fg = "background", bg = "leaf" }
"ui.cursor.select" = { fg = "background", bg = "plum" }
"ui.cursor.match" = { fg = "background", bg = "slate_blue", modifiers = ["bold"] }
"ui.cursor.primary" = { fg = "background", bg = "foreground" }
"ui.cursor.primary.normal" = { fg = "background", bg = "foreground" }
"ui.cursor.primary.insert" = { fg = "background", bg = "leaf" }
"ui.cursor.primary.select" = { fg = "background", bg = "plum" }
"ui.cursorline.primary" = { bg = "cursorline" }
"ui.cursorline.secondary" = { bg = "cursorline" }
"ui.cursorcolumn.primary" = { bg = "cursorline" }
"ui.cursorcolumn.secondary" = { bg = "cursorline" }
"ui.linenr" = "line_number"
"ui.linenr.selected" = { fg = "line_number_active", bg = "cursorline" }
"ui.statusline" = { fg = "status_fg", bg = "status_bg" }
"ui.statusline.inactive" = { fg = "comment", bg = "border" }
"ui.statusline.normal" = { fg = "status_fg", bg = "status_bg" }
"ui.statusline.insert" = { fg = "background", bg = "leaf" }
"ui.statusline.select" = { fg = "background", bg = "plum" }
"ui.statusline.separator" = "border"
"ui.popup" = { fg = "foreground", bg = "border" }
"ui.popup.info" = { fg = "foreground", bg = "border" }
"ui.window" = { fg = "border", bg = "background" }
"ui.help" = { fg = "foreground", bg = "border" }
"ui.text" = "foreground"
"ui.text.focus" = { fg = "background", bg = "plum" }
"ui.text.inactive" = "comment"
"ui.text.info" = "foreground"
"ui.virtual" = "comment"
"ui.virtual.ruler" = { bg = "border" }
"ui.virtual.whitespace" = "comment"
"ui.virtual.indent-guide" = "line_number"
"ui.virtual.inlay-hint" = { fg = "comment", bg = "cursorline" }
"ui.virtual.inlay-hint.parameter" = { fg = "comment", bg = "cursorline" }
"ui.virtual.inlay-hint.type" = { fg = "comment", bg = "cursorline" }
"ui.virtual.wrap" = "comment"
"ui.virtual.jump-label" = { fg = "background", bg = "slate_blue", modifiers = ["bold"] }
"ui.menu" = { fg = "foreground", bg = "border" }
"ui.menu.selected" = { fg = "background", bg = "plum" }
"ui.menu.scroll" = { fg = "comment", bg = "foreground" }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.highlight" = { bg = "selection" }
"ui.highlight.frameline" = { bg = "selection" }
"ui.debug.breakpoint" = { fg = "error", bg = "background" }
"ui.debug.active" = { fg = "slate_blue", bg = "background" }
"ui.gutter" = { bg = "background" }
"ui.gutter.selected" = { bg = "cursorline" }
"ui.picker.header" = { fg = "plum", modifiers = ["bold"] }
"ui.picker.header.column" = "foreground"
"ui.picker.header.column.active" = { fg = "plum", modifiers = ["bold"] }

# Diagnostics
"warning" = { fg = "warning", bg = "warning_bg", modifiers = ["bold"] }
"error" = { fg = "error", bg = "error_bg", modifiers = ["bold"] }
"info" = { fg = "info", bg = "info_bg", modifiers = ["bold"] }
"hint" = { fg = "hint", bg = "hint_bg", modifiers = ["bold"] }
"diagnostic" = { modifiers = ["underlined"] }
"diagnostic.hint" = { underline = { color = "hint", style = "curl" } }
"diagnostic.info" = { underline = { color = "info", style = "curl" } }
"diagnostic.warning" = { underline = { color = "warning", style = "curl" } }
"diagnostic.error" = { underline = { color = "error", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { fg = "rosewood", modifiers = ["crossed_out"] }

# Special markup
"markup.normal.completion" = { fg = "foreground", bg = "status_bg" }
"markup.normal.hover" = { fg = "foreground", bg = "status_bg" }
"markup.heading.completion" = { fg = "slate_blue", modifiers = ["bold"] }
"markup.heading.hover" = { fg = "slate_blue", modifiers = ["bold"] }
"markup.raw.inline.completion" = { fg = "leaf" }
"markup.raw.inline.hover" = { fg = "leaf" }

[palette]
# Base colors
background = "#f5f2ed"
foreground = "#3d3a33"
selection = "#e3d5b8"        # Warm sand (improved visibility)
cursorline = "#ebe6db"       # Subtle current line highlight
border = "#d4cfc4"

# UI colors
line_number = "#b5ad9a"
line_number_active = "#7a7260"
status_bg = "#ebe6db"
status_fg = "#5a5549"

# Syntax colors - muted hues
comment = "#6e665a"
leaf = "#496842"
plum = "#7d5371"
slate_blue = "#3f6386"
ochre = "#6d602f"
charcoal = "#5a5240"
taupe = "#6a6350"
chocolate = "#8b6340"
cinnamon = "#845540"
spruce = "#356967"
rosewood = "#86534c"

# Syntax background colors - subtle warm tints for clarity
string_bg = "#e2ede0"
keyword_bg = "#f4e4ef"
comment_bg = "#ebe8e0"       # Warm gray for comments
slate_bg = "#deebf8"
cinnamon_bg = "#f7e5dd"
ochre_bg = "#eee9d9"
namespace_bg = "#e4e8ed"     # Light blue-gray for namespaces
param_bg = "#ebe6db"         # Very subtle beige for parameters
error_bg = "#f7ebe6"         # Warm peachy-beige for error diagnostics
warning_bg = "#f5ead8"       # Warm sandy-beige for warning diagnostics
info_bg = "#e6ede3"          # Subtle green tint for info diagnostics
hint_bg = "#ede9e0"          # Subtle gray-brown for hint diagnostics
spruce_bg = "#daefed"
rose_bg = "#f8e4e1"

# Special colors (expert-refined)
error = "#aa4f4f"
warning = "#c68a2e"
info = "#007785"
hint = "#8a826f"
